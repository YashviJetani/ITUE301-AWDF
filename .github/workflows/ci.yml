name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test Task Management API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v18)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install API Dependencies
        run: |
          cd task-manager-api
          npm install

      - name: Execute Automated Jest Tests
        run: |
          cd task-manager-api
          npm test
